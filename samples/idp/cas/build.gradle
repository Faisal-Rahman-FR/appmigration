plugins {
    id 'war'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.freefair.war-overlay' version '8.14'
}
repositories { mavenCentral() }
group = 'demo.identity'
version = '1.0.0'
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
dependencies {
    implementation enforcedPlatform('org.apereo.cas:cas-server-support-bom:7.1.6')
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.apereo.cas:cas-server-core-api-configuration-model'
    implementation 'org.apereo.cas:cas-server-core-web-api'
    implementation 'org.springframework.security:spring-security-config'
    implementation 'org.apereo.cas:cas-server-webapp-init'
    implementation 'org.apereo.cas:cas-server-webapp-init-tomcat'
    implementation 'org.apereo.cas:cas-server-support-ldap'
    implementation 'org.apereo.cas:cas-server-support-json-service-registry'
}
springBoot { mainClass = 'org.apereo.cas.web.CasWebApplication' }
bootWar {
    archiveFileName = 'cas.war'
    entryCompression = ZipEntryCompression.STORED
    overlays {
        cas {
            from 'org.apereo.cas:cas-server-webapp-tomcat:7.1.6@war'
            provided = false
            excludes = ['WEB-INF/lib/servlet-api-2*.jar']
        }
    }
}
