ServerName events.demo.test
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/events/public_html>
  # cPanel-style: the per-directory .htaccess below the web root carries the sign-in rules.
  AllowOverride All
  Options -Indexes +FollowSymLinks
  Require all granted
</Directory>
<Directory /var/www/events/public_html/admin>
  # Drop client-supplied CAS_* request headers (directory scope only; not allowed in .htaccess).
  CASScrubRequestHeaders On
</Directory>

# mod_auth_cas (used when EVENTS_AUTH=cas). The directives are harmless when no .htaccess asks for AuthType CAS.
CASCookiePath /var/cache/apache2/mod_auth_cas/
CASLoginURL ${CAS_ORIGIN}/cas/login
CASValidateURL ${CAS_ORIGIN}/cas/serviceValidate
CASVersion 2
# Setting a CA file turns on server certificate validation; there is no separate on/off directive in this module version.
CASCertificatePath /run/events-cas-ca.pem
# TLS ends at the gateway; without this the module would build http:// service URLs.
CASRootProxiedAs ${EVENTS_ORIGIN}
CASCookieHttpOnly On
CASTimeout 28800
CASIdleTimeout 3600
# The module does not know the request was HTTPS, so its cookie has no Secure flag: the gateway adds it (proxy_cookie_flags in nginx.conf.template).
